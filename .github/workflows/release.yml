name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os; from actask_cli import __version__; expected = os.environ['RELEASE_TAG'].removeprefix('v'); assert __version__ == expected, f'Package version {__version__} does not match tag {expected}'"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest
      - name: Build distributions
        run: python -m build

  build:
    name: ${{ matrix.platform }} binary
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            extension: .exe
          - platform: linux-x64
            runner: ubuntu-latest
            extension: ""
          - platform: macos-x64
            runner: macos-15-intel
            extension: ""
          - platform: macos-arm64
            runner: macos-14
            extension: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install package builder
        run: python -m pip install . pyinstaller
      - name: Build native binary
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --name actask
          src/actask_cli/__main__.py
      - name: Prepare named release asset
        shell: bash
        run: |
          mkdir -p release
          mv "dist/actask${{ matrix.extension }}" "release/actask-${{ matrix.platform }}${{ matrix.extension }}"
      - name: Smoke test native binary
        shell: bash
        run: >-
          python scripts/smoke_release_binary.py
          --binary "release/actask-${{ matrix.platform }}${{ matrix.extension }}"
      - name: Upload release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actask-${{ matrix.platform }}
          path: release/actask-${{ matrix.platform }}${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Publish public GitHub release
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-artifacts
          sha256sum actask-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" release-artifacts/actask-* release-artifacts/SHA256SUMS
          --title "Actask CLI ${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
